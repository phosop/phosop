<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phosop</title>
    <style>
      :root {
        --bg: #f5f4ee;
        --surface: #fefdfb;
        --border: #e6e3d8;
        --text: #1a1915;
        --muted: #74726a;
        --accent: #d97757;
        --accent-hover: #c15f3c;
        --mono: "Berkeley Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { color: var(--accent-hover); text-decoration: underline; }
      input {
        font-family: var(--mono);
        font-size: 13px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.15);
      }
      button {
        font-family: var(--sans);
        font-weight: 550;
        border: none;
        border-radius: 8px;
        transition: background 0.15s, opacity 0.15s;
      }
      button:hover { opacity: 0.92; }
      code { font-family: var(--mono); }
      /* Match the Solana wallet button to the Claude coral theme */
      .wallet-adapter-button {
        background: var(--accent) !important;
        border-radius: 8px !important;
        height: 40px !important;
        font-family: var(--sans) !important;
        font-weight: 550 !important;
      }
      .wallet-adapter-button:hover { background: var(--accent-hover) !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
