services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - phosop_mongo:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/phosop
    ports:
      - '3333:3333'
    depends_on:
      - mongo

volumes:
  phosop_mongo:
